name: CI

on:
  push:
    branches: [main, preview]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - run: npm ci

      - run: npm run test

      - run: npm run build
